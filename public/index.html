<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="vendor/matter.min.js"></script>
</head>
<body>
<header id="topbar">
  <span class="brand" id="app-brand">Vehicle Sandbox</span>
  <nav>
    <!-- "Vehicle Editor" button removed: the editor is reached via a vehicle's Edit
         Vehicle control in the world. The element stays in the DOM (hidden) because
         the headless smoke probes navigate to it by id. -->
    <button id="tab-editor" class="tab active" hidden>Vehicle Editor</button>
    <!-- "World" is relabelled "Done" and shown only while editing a vehicle. -->
    <button id="tab-world" class="tab">Done</button>
  </nav>
  <div class="spacer"></div>
  <select id="recent-select" title="Recent files"><option value="">Recents…</option></select>
  <!-- Lucide icons (inline SVG, ISC): upload = load a file in, download = save one out. -->
  <button id="import-vehicle" title="Load a vehicle JSON file"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><path d="M12 15V3"/></svg></button>
  <button id="export-vehicle" title="Download the current vehicle as JSON"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/></svg></button>
  <!-- World load/save only makes sense on the World page; hidden while editing. -->
  <button id="import-world" title="Load a world JSON file" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><path d="M12 15V3"/></svg></button>
  <button id="export-world" title="Download the current world as JSON" hidden><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/></svg></button>
  <input type="file" id="file-input" accept=".json" hidden>
</header>

<main>
  <!-- ============ VEHICLE EDITOR TAB ============ -->
  <section id="panel-editor" class="tab-panel active">
    <aside class="side" id="editor-palette">
      <h3>Components</h3>
      <div id="palette"></div>
      <h3>Gates</h3>
      <div id="gate-palette"></div>
      <h3>Body</h3>
      <div id="body-color"></div>
      <div class="pane-footer">Designed by Adam Kemp, 2026</div>
    </aside>
    <div class="canvas-wrap">
      <canvas id="editor-canvas"></canvas>
    </div>
    <aside class="side" id="editor-inspector">
      <h3>Placed</h3>
      <ul id="placed-list"></ul>
      <h3>Wires</h3>
      <ul id="wire-list"></ul>
      <div id="wiring-errors"></div>
      <div id="inspector"></div>
    </aside>
  </section>

  <!-- ============ WORLD TAB ============ -->
  <section id="panel-world" class="tab-panel">
    <aside class="side" id="world-side">
      <!-- World sidebar tabs (Sandbox / Co-Op): the user only sees the controls for the mode they
           are in. Sandbox shows the single-player world (elements + vehicles); Co-Op shows the
           shared-world controls (gateway, name, host/join, disconnect, fleet). Joining a shared
           world disables the Sandbox tab; leaving re-enables it (see main.js setSandboxDisabled). -->
      <nav class="side-tabs" id="world-side-tabs" aria-label="World modes">
        <button class="side-tab active" id="mode-sandbox" data-side="sandbox" title="Single-player sandbox world">Sandbox</button>
        <button class="side-tab" id="mode-coop" data-side="coop" title="Shared co-op world">Co-Op</button>
      </nav>
      <!-- Sandbox pane: the single-player world — elements and vehicles only. -->
      <div class="side-pane active" id="side-pane-sandbox">
        <h3>Elements</h3>
        <button id="add-light">+ Light source</button>
        <button id="add-rock">+ Rock (circle)</button>
        <button id="add-wall">+ Wall (rect)</button>
        <h3>Vehicles</h3>
        <button id="add-vehicle">+ Add Vehicle</button>
        <div id="prototypes"></div>
      </div>
      <!-- Co-op (M5): one gateway hosts many coded worlds. Host a fresh world to share its code,
           or join an existing one — this client's bots are added to that shared world. -->
      <div class="side-pane" id="side-pane-coop" hidden>
        <!-- Design controls sit above the Co-op section: visible before connecting too, and
             Deploy stays greyed out (disabled) until the client has joined/hosted a world. -->
        <h3>Vehicles</h3>
        <div class="coop-gw-row coop-design-row">
          <button id="coop-edit" title="Open the editor on your co-op design">Edit my design</button>
          <button id="coop-deploy" disabled title="Push your current design into the shared world — you drive your own bots only">Deploy design</button>
        </div>
        <!-- Shared fleet (M5 p3–4): other participants' deployed vehicles, add/remove for the host -->
        <div id="remote-fleet" hidden></div>
        <h3>Co-op</h3>
        <!-- No gateway address to type: the gateway shares this server's port, so a joiner is
             already pointed at the right place whenever the page came from the host. The address
             only exists under Advanced, for the rare case of joining a world from a page that was
             served somewhere else. -->
        <div id="coop-gw-fields">
          <label>Name<input type="text" id="coop-gw-name" maxlength="24" placeholder="you"></label>
          <details id="coop-advanced" class="coop-advanced">
            <summary>Advanced<span class="dim" id="coop-advanced-tag"></span></summary>
            <label>Host address<input type="text" id="coop-host-addr" spellcheck="false" autocomplete="off"
              placeholder="automatic"></label>
            <div class="dim coop-hint" id="coop-host-addr-hint"></div>
          </details>
        </div>
        <!-- Host on its own row above the Join row; both hide together once connected.
             The join code field takes the remaining width of the column. -->
        <div id="coop-gw-row">
          <button id="coop-host" title="Create a new shared world and show its join code">Host</button>
          <div class="coop-gw-row coop-join-row">
            <input type="text" id="coop-join-code" maxlength="6" spellcheck="false" placeholder="code">
            <button id="coop-join" title="Join the shared world with that code">Join</button>
          </div>
        </div>
        <button id="coop-disconnect" hidden>Disconnect</button>
        <div id="coop-gw-code" class="coop-code" hidden></div>
        <!-- The one thing a host has to share: a link that loads the app FROM this server and joins
             this world. Selectable text (clipboard API needs https), with a Copy button that falls
             back to a selection on plain http. -->
        <div id="coop-invite-row" class="coop-invite-row" hidden>
          <input type="text" id="coop-invite" readonly spellcheck="false" title="Send this to anyone on your network">
          <button id="coop-copy" title="Copy the invite link">Copy</button>
        </div>
        <div class="dim coop-hint" id="coop-invite-alt" hidden></div>
        <h3>Status</h3>
        <div id="coop-gw-status" class="dim">not in a shared world</div>
      </div>
      <div class="pane-footer">Designed by Adam Kemp, 2026</div>
    </aside>
    <div class="canvas-wrap">
      <canvas id="world-canvas"></canvas>
      <!-- Brief mode-transition animation ("Joining/Leaving world…") shown over the canvas while
           the sandbox world clears and the shared world loads — or back again (main.js). -->
      <div id="world-transition" class="world-transition" hidden>
        <div class="world-transition-inner">
          <span class="world-transition-msg" id="world-transition-msg">Joining world…</span>
          <span class="world-transition-bar"><span></span></span>
        </div>
      </div>
      <div id="world-controls">
        <button id="btn-play">▶ Play</button>
        <button id="btn-step" title="Advance one physics step">Step</button>
        <button id="btn-reset">Reset</button>
        <label id="timescale-label">Time <input type="range" id="timescale" min="0.1" max="3" step="0.1" value="1"><span id="timescale-val">1.0×</span></label>
        <button id="btn-beams">Beams: on</button>
        <button id="btn-values" title="Show sensor and motor values on each robot body">Values: on</button>
        <button id="btn-paths" title="Show the motion trail behind each robot">Paths: off</button>
      </div>
      <div id="world-inspector"></div>
    </div>
  </section>

  </main>

<script type="module" src="app/main.js"></script>
</body>
</html>
