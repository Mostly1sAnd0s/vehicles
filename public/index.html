<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="vendor/matter.min.js"></script>
</head>
<body>
<header id="topbar">
  <span class="brand" id="app-brand">Vehicle Sandbox</span>
  <nav>
    <!-- "Vehicle Editor" button removed: the editor is reached via a vehicle's Edit
         Vehicle control in the world. The element stays in the DOM (hidden) because
         the headless smoke probes navigate to it by id. -->
    <button id="tab-editor" class="tab active" hidden>Vehicle Editor</button>
    <!-- "World" is relabelled "Done" and shown only while editing a vehicle. -->
    <button id="tab-world" class="tab">Done</button>
  </nav>
  <div class="spacer"></div>
  <select id="recent-select" title="Recent files"><option value="">Recents…</option></select>
  <button id="import-vehicle" title="Import a vehicle JSON file">⤓ Vehicle</button>
  <button id="export-vehicle" title="Download the current vehicle as JSON">⤒ Vehicle</button>
  <!-- World load/save only makes sense on the World page; hidden while editing. -->
  <button id="import-world" title="Import a world JSON file" hidden>⤓ World</button>
  <button id="export-world" title="Download the current world as JSON" hidden>⤒ World</button>
  <input type="file" id="file-input" accept=".json" hidden>
</header>

<main>
  <!-- ============ VEHICLE EDITOR TAB ============ -->
  <section id="panel-editor" class="tab-panel active">
    <aside class="side" id="editor-palette">
      <h3>Components</h3>
      <div id="palette"></div>
      <h3>Gates</h3>
      <div id="gate-palette"></div>
      <h3>Body</h3>
      <div id="body-color"></div>
      <div class="pane-footer">Designed by Adam Kemp, 2026</div>
    </aside>
    <div class="canvas-wrap">
      <canvas id="editor-canvas"></canvas>
    </div>
    <aside class="side" id="editor-inspector">
      <h3>Placed</h3>
      <ul id="placed-list"></ul>
      <h3>Wires</h3>
      <ul id="wire-list"></ul>
      <div id="wiring-errors"></div>
      <div id="inspector"></div>
    </aside>
  </section>

  <!-- ============ WORLD TAB ============ -->
  <section id="panel-world" class="tab-panel">
    <aside class="side" id="world-side">
      <h3>Elements</h3>
      <button id="add-light">+ Light source</button>
      <button id="add-rock">+ Rock (circle)</button>
      <button id="add-wall">+ Wall (rect)</button>
      <h3>Vehicles</h3>
      <button id="add-vehicle">+ Add Vehicle</button>
      <div id="prototypes"></div>
      <!-- Shared fleet (M5 p3–4): other participants' deployed vehicles, add/remove for the host -->
      <div id="remote-fleet" hidden></div>
      <!-- Co-op (phase M5): one gateway hosts many coded worlds. Host a fresh world to share its
           code, or join an existing one — this client's bots are added to that shared world.
           The standalone Co-op tab was folded into the World sidebar. -->
      <h3>Co-op</h3>
      <label>Gateway<input type="text" id="coop-gw-url" spellcheck="false" placeholder="ws://127.0.0.1:8090"></label>
      <label>Name<input type="text" id="coop-gw-name" maxlength="24" placeholder="you"></label>
      <div class="coop-gw-row" id="coop-gw-row">
        <button id="coop-host" title="Create a new shared world and show its join code">Host</button>
        <input type="text" id="coop-join-code" maxlength="6" spellcheck="false" placeholder="code">
        <button id="coop-join" title="Join the shared world with that code">Join</button>
      </div>
      <button id="coop-disconnect" hidden>Disconnect</button>
      <div class="coop-gw-row">
        <button id="coop-edit" hidden title="Open the editor on your co-op design">✎ Edit my design</button>
        <button id="coop-deploy" hidden title="Push your current design into the shared world — you drive your own bots only">Deploy design</button>
      </div>
      <div class="coop-gw-row" id="coop-controls" hidden>
        <button id="coop-start" title="Start the shared simulation (host)">▶ Start</button>
        <button id="coop-pause" title="Pause the shared simulation (host)">⏸ Pause</button>
        <button id="coop-reset" title="Return every bot to its spawn point (host)">↺ Reset</button>
      </div>
      <div id="coop-gw-code" class="coop-code" hidden></div>
      <div id="coop-gw-status" class="dim">not in a shared world</div>
      <div class="pane-footer">Designed by Adam Kemp, 2026</div>
    </aside>
    <div class="canvas-wrap">
      <canvas id="world-canvas"></canvas>
      <div id="world-controls">
        <button id="btn-play">▶ Play</button>
        <button id="btn-step" title="Advance one physics step">Step</button>
        <button id="btn-reset">Reset</button>
        <label>Time <input type="range" id="timescale" min="0.1" max="3" step="0.1" value="1"><span id="timescale-val">1.0×</span></label>
        <button id="btn-beams">Beams: on</button>
        <button id="btn-values" title="Show sensor and motor values on each robot body">Values: on</button>
        <button id="btn-paths" title="Show the motion trail behind each robot">Paths: off</button>
      </div>
      <div id="world-inspector"></div>
    </div>
  </section>

  </main>

<script type="module" src="app/main.js"></script>
</body>
</html>
